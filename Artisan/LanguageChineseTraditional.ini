You can either copy/paste macros directly as you would a normal game macro, or list each action on its own per line.\nFor example:\n/ac Muscle Memory\n\nis the same as\n\nMuscle Memory\n\nYou can also use * (asterisk) or 'Artisan Recommendation' to insert Artisan's recommendation as a step.==你可以像一般遊戲巨集一樣直接複製／貼上巨集，也可以每行單獨列出一個技能。\n例如：\n/ac 堅信\n\n等同於\n\n堅信\n\n你也可以使用*（星號）或「Artisan建議」插入Artisan的建議作為步驟。
