If enabled, Artisan will automatically repair your gear when any piece reaches the configured repair threshold.\n\nCurrent min gear condition is ??% and cost to repair at a vendor is ?? gil.\n\nIf unable to repair with Dark Matter, will try for a nearby repair NPC.==若啟用，當任何裝備達到設定的修理閾值時，Artisan會自動修理你的裝備。\n\n目前裝備最低耐久為??%，於修理工處修理的費用為??Gil。\n\n若無法以黑暗物質修理，將嘗試尋找附近的修理NPC。
