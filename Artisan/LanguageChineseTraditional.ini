Guide to importing lists.\n\nOption A: Paste your Teamcraft list's URL (https://ffxivteamcraft.com/list/...) into the Teamcraft Link box. The list is fetched from Teamcraft directly, including pre-crafts, so this works no matter which language Teamcraft is displaying.\n\nOption B: Use Teamcraft's "Copy as Text" button on the pre crafts and final items sections, and paste them into the boxes below. Item names in English, Simplified Chinese or the game client's language are all recognised.\n\nGive your list a name and click import.==清單匯入指南。\n\n方式A：把Teamcraft清單的網址（https://ffxivteamcraft.com/list/...）貼到「Teamcraft連結」欄位。清單內容（含半成品）會直接從Teamcraft線上抓取，無論Teamcraft顯示什麼語言都能匯入。\n\n方式B：在Teamcraft的半成品與成品區塊分別點擊「Copy as Text」按鈕，將文字貼到下方對應欄位。物品名稱支援英文、簡體中文或遊戲用戶端語言。\n\n為清單命名後點擊匯入。
Accepts a Teamcraft list URL (ffxivteamcraft.com/list/...), fetched online with pre-crafts included, or an import link (ffxivteamcraft.com/import/...), decoded offline. Items are matched by ID, so any Teamcraft display language works.==支援Teamcraft清單網址（ffxivteamcraft.com/list/...，線上抓取、含半成品）或匯入連結（ffxivteamcraft.com/import/...，離線解析）。物品以ID比對，Teamcraft任何顯示語言皆可。
