In order to begin Endurance Mode crafting you should first select the recipe in the crafting menu.\nEndurance Mode will automatically repeat the selected recipe similar to Auto-Craft but will factor in food/medicine buffs before doing so.==要開始耐力模式製作，請先在製作選單中選擇配方。\n耐力模式會自動重複製作所選配方，並會在製作前考慮食物／藥品增益。
