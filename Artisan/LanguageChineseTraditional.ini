Artisan - Overview==Artisan - 概述
I would first like to thank you for downloading my little crafting plugin. I have been working on Artisan consistently since June 2022 and it's my magnum opus of a plugin.==首先感謝你下載我的這個小小的製作插件。自2022年6月以來，我一直持續開發Artisan，這是我的插件代表作。
It is free and you should not be paying anyone for it.==它是免費的，你不應該向任何人付費取得它。
Before you get started with Artisan, we should go over a few things about how the plugin works. Artisan is simple to use once you understand a few key factors.==在開始使用Artisan之前，我們應該先了解插件的運作方式。只要掌握幾個關鍵要素，Artisan就非常容易上手。
Crafting Modes==製作模式
Artisan features an "Automatic Action Execution Mode" which merely takes the suggestions provided to it and performs the action on your behalf. By default, this will fire as fast as the game allows, which is faster than normal macros. You are not bypassing any sort of game restrictions doing this, however you can set a delay should you choose to. Enabling this has nothing to do with the suggestion making process Artisan uses by default.==Artisan具有「自動製作模式」，該模式僅接受內建解算器提供的建議並代替你執行技能。預設情況下，它會以遊戲允許的最快速度施放技能，比一般遊戲巨集更快。這並沒有繞過任何遊戲限制，如果你希望慢一點，也可以設定延遲。啟用此選項不影響Artisan預設的建議產生過程。
If you do not have the automatic mode enabled, you will have access to 2 more modes. "Semi-Manual Mode" and "Full Manual". "Semi-Manual Mode" will appear in a small pop-up window when you start crafting.==如果你沒有啟用自動模式，你還可以使用另外2種模式：「半自動模式」和「全手動模式」。「半自動模式」會在你開始製作時顯示在一個彈出的小視窗中。
By clicking the "Execute recommended action" button, you are instructing the plugin to perform the suggestion it has recommended. This considered semi-manual as you still have to click each action, but you don't have to worry about finding them on your hotbars. "Full-Manual" mode is performed by pressing the buttons on your hotbar as normal. You are provided with an aid by default as Artisan will highlight the action on your hotbar if it is slotted. (This can be disabled in the settings)==點擊「執行建議的技能」按鈕，插件就會執行目前建議的製作技能。這被視為半自動，因為你仍需每一步點擊一次按鈕，但不必在快速鍵列上尋找對應技能。「全手動模式」則是照常按下快速鍵列上的技能。預設情況下你會獲得輔助：如果技能已放到快速鍵列上，Artisan會以高亮框提示對應技能（可在設定中停用）。
Solvers/Macros==解算器/巨集
Artisan by default will provide you with suggestions on what your next crafting step should be. This solver is not perfect however and it is definitely not a substitute for having appropriate gear. You do not need to do anything to enable this behaviour other than have Artisan enabled. \n\nIf you are trying to tackle a craft that the default solver cannot craft, Artisan allows you to build macros which can be used as the suggestions instead of the default solver. Artisan macros have the benefit of not being restricted in length, can fire off as fast as the game allows and also allows some additional options to tweak on the fly.==預設情況下，Artisan會為你提供下一步製作技能的建議。然而這個解算器並不完美，絕不能取代一套合適的製作裝備。除了啟用Artisan之外，你無需執行任何操作。\n\n如果你要處理預設解算器無法完成的製作，Artisan允許你建立巨集來取代預設解算器的建議。Artisan巨集的優點是不受長度限制、可以以遊戲允許的最快速度施放技能，還提供一些可即時調整的額外選項。
Click here to be taken to the Macro menu.==點擊此處前往巨集選單。
Once you have created a macro, you will have to assign it to a recipe. This is easily accomplished by using the Recipe Window dropdown. By default, this is attached to the top right of the in-game crafting log window but can be unattached in the settings.==建立巨集後，你需要將其指派給配方。透過「配方視窗」下拉選單即可輕鬆完成。預設情況下，它會附加在遊戲內製作筆記視窗的右上角，可在設定中取消附加。
Select a macro you have created from the dropdown box. When you go to craft this item, the suggestions will be replaced by the contents of your macro.==從下拉選單中選擇你建立的巨集。當你製作該物品時，技能建議將被巨集內容取代。
Artisan has a mode titled "Endurance Mode" which is basically a fancier way of saying "Auto-repeat mode" which will continually try to craft the same item for you. Endurance Mode works by selecting a recipe from the in-game crafting log and enabling the feature. Your character will then attempt to keep crafting that item as many times as you have materials for it. \n\nThe other features should hopefully be self-explanatory as Endurance Mode can also manage the usage of your food, potions, manuals, repairs and materia extraction between crafts. The repair feature only supports repairing with dark matter and does not support repair NPCs.==Artisan有一個名為「耐力模式」的功能，其實就是「自動重複模式」的花俏說法，它會不斷為你重複製作相同的物品。耐力模式的用法是在遊戲內製作筆記中選擇一個配方並啟用該功能。接著，你的角色會在素材足夠的情況下不斷製作該物品。\n\n其他功能應該一目瞭然：耐力模式還可以管理食物、藥品、指南的使用，以及製作之間的修理和精製魔晶石。修理功能僅支援使用黑暗物質自行修理，不支援修理NPC。
Click here to be taken to the Endurance menu.==點擊此處前往耐力模式選單。
Artisan also has the ability to create a list of items and have it start crafting each of them, one after another, automatically. Crafting lists have a lot of powerful tools to streamline the process of going from materials to final products. It also supports importing and exporting to Teamcraft.==Artisan還能建立物品清單，並自動依序製作清單內的每個物品。製作清單有許多強大的工具，可簡化從素材到成品的流程。它還支援與Teamcraft互相匯入匯出。
Click here to be taken to the Crafting List menu.==點擊此處前往製作清單選單。
