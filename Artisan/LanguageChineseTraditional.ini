Crafting lists are a fantastic way to queue up different crafts and have them craft one-by-one. Create a list by importing from Teamcraft using the button at the bottom, or click the '+' icon and give your list a name. You can also right click an item from the game's recipe menu to either add it to a new list if one is not selected, or to create a new list with it as the first item if a list is not selected.==製作清單是把不同製作物品排入佇列、逐一製作的絕佳方式。可使用底部按鈕從Teamcraft匯入來建立清單，或點擊「+」圖示並為清單命名。你也可以在遊戲配方選單中的物品上按右鍵：若已選擇清單，將其加入該清單；若未選擇清單，則以它作為第一個物品建立新清單。
Left click a list to open the editor. Right click a list to select it without opening the editor.==左鍵點擊清單開啟編輯器。右鍵點擊清單僅選擇而不開啟編輯器。
