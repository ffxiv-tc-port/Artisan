Endurance mode is Artisan's way to repeat the same craft over and over, either so many times or until you run out of materials. It has full capabilities to automatically repair your gear once a piece is under a certain percentage, use food/potions/exp manuals and extract materia from spiritbonding. Please note these settings are independent of crafting list settings, and only intended to be used to craft the one item repeatedly.==耐力模式是Artisan重複製作同一配方的方式，可指定次數或直到素材用完。它具備完整功能：當某件裝備耐久低於設定百分比時自動修理、自動使用食物／藥品／經驗指南，以及在精煉度滿值時精製魔晶石。請注意，這些設定與製作清單的設定互相獨立，僅用於重複製作單一物品。
